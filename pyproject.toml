[project]
name = "business-pipeline"
version = "0.1.0"
description = "Extracts and structures business information for the Alameda del Río directory."
requires-python = ">=3.12"
# Step 1 (ingest) uses only the standard library. Packages are added per step, when needed.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two independent packages: the WhatsApp/TSV pipeline and the Google Maps extraction (Outscraper).
packages = ["src/business_pipeline", "src/outscraper_extract"]
